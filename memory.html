<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Board</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#8ea0ad;
    overflow-x:hidden;
}

/* TITLE */
h2{
    text-align:center;
    color:white;
    margin:20px;
}

/* BOARDS */
.wrapper{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:20px;
}

.board{
    width:320px;
    height:560px;
    background:#d6b48a;
    border:8px solid #7a4e2f;
    overflow:auto;
    position:relative;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    padding:10px;
}

/* scrollbar */
.board::-webkit-scrollbar{width:6px;}
.board::-webkit-scrollbar-thumb{
    background:#7a4e2f;
    border-radius:10px;
}

/* CARD */
.card{
    background:white;
    border-radius:10px;
    margin:10px 0;
    overflow:hidden;
    box-shadow:2px 5px 12px rgba(0,0,0,0.2);
    cursor:pointer;
    transition:0.3s;
}

.card:hover{transform:scale(1.03);}

/* MEDIA */
.card img,
.card video{
    width:100%;
    height:140px;
    object-fit:cover;
}

.caption{
    text-align:center;
    font-size:11px;
    padding:5px;
    background:#fff8dc;
}

/* VIEWER */
.viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:10;
}

.viewer img,
.viewer video{
    max-width:90%;
    max-height:80vh;
    border-radius:10px;
}

/* CLOSE */
.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    color:white;
    cursor:pointer;
}

/* CONTROLS */
.controls button,
#slideBtn{
    font-size:18px;
    padding:8px 12px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#slideBtn{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:20;
    background:white;
}

/* FADE */
.fade{
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

</style>
</head>

<body>

<h2>📌 Memory Board</h2>

<button id="slideBtn" onclick="toggleSlideshow()">🎬 Slideshow</button>

<div class="wrapper">
    <div class="board" id="b1"></div>
    <div class="board" id="b2"></div>
    <div class="board" id="b3"></div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
    <div class="close" onclick="closeViewer()">×</div>
    <div id="viewerContent"></div>

    <div class="controls">

/* ===== BOARDS ===== */
let boards=[b1,b2,b3];

/* ===== RENDER CARDS ===== */
items.forEach((item,i)=>{

    let div=document.createElement("div");
    div.className="card";

    div.innerHTML = item.type==="image"
    ? `<img src="${item.src}"><div class="caption">Memory ${i+1}</div>`
    : `<video muted src="${item.src}"></video><div class="caption">Video ${i+1}</div>`;

    div.onclick=()=>openViewer(i);

    boards[i%3].appendChild(div);
});

/* ===== VIEWER ===== */
let current=0;

function openViewer(i){
    current=i;
    document.getElementById("viewer").style.display="flex";
    show();
}

function closeViewer(){
    document.getElementById("viewer").style.display="none";
}

function show(){
    let c=document.getElementById("viewerContent");
    let item=items[current];

    c.className="fade";

    c.innerHTML = item.type==="image"
    ? `<img src="${item.src}">`
    : `<video controls autoplay src="${item.src}"></video>`;
}

/* NEXT / PREV */
function next(){
    current=(current+1)%items.length;
    show();
}

function prev(){
    current=(current-1+items.length)%items.length;
    show();
}

/* ===== SLIDESHOW (IMAGE + VIDEO SUPPORTED) ===== */
let slide=false;
let interval;

function toggleSlideshow(){
    slide=!slide;

    if(slide){
        interval=setInterval(()=>{
            next();
        },1750);
    }else{
        clearInterval(interval);
    }
}
