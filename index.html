<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Birthday Surprise 🎉</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

/* ================= BACKGROUND ================= */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;

    background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
    url("https://i.pinimg.com/736x/ee/56/fd/ee56fd520c3cff05bbcbee9a9a63eff9.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* sparkle */
body::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(white 1px, transparent 1px);
    background-size:35px 35px;
    opacity:0.12;
    pointer-events:none;
}

/* ================= FLOATING DECOR ================= */
.bubble{
    position:absolute;
    border-radius:60%;
    background:rgba(186, 7, 7, 0.18);
    animation:float 6s ease-in-out infinite;
    z-index:1;
}

/* FIXED POSITIONS (NO DUPLICATES) */
.b1{width:80px;height:80px;top:18%;right:8%;}
.b2{width:55px;height:55px;bottom:12%;left:7%;animation-delay:1s;}
.b3{width:35px;height:35px;top:65%;right:18%;animation-delay:2s;}
.b4{width:45px;height:45px;bottom:20%;right:25%;animation-delay:3s;}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

/*  CONTAINER  */
.container {
    position:relative;
    z-index:2;
    max-width: 600px;
    padding: 40px;
    border-radius: 30px;

    background: rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);

    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* ================= TEXT ================= */
h1 {
    font-size: 2.4rem;
    color: #ffcc33;
    margin-bottom: 10px;
}

h2 {
    font-weight: 300;
    color: #eee;
    min-height: 50px;
}

p {
    font-size: 1rem;
    color: #ddd;
}

/* ================= GIFT ================= */
.gift-box {
    margin-top: 25px;
    display: inline-block;
    animation: floatGift 2.5s infinite ease-in-out;
    cursor: pointer;
}

.gift-box img {
    width: 140px;
    border-radius: 15px;
    border: 3px solid #a59563;
    transition: 0.3s;
}

.gift-box img:hover {
    transform: scale(1.1) rotate(5deg);
}

@keyframes floatGift {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

</style>
</head>

<body>

<!-- FLOATING BUBBLES -->
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>

<!-- MAIN -->
<div class="container">

    <h1>🎁 Happy 21st Birthday, Yana! 🎁</h1>
    <h2 id="typeText"></h2>
    <p>Tap the photo to reveal your surprise ✨</p>

    <div class="gift-box" onclick="goSurprise()">
        <img src="avianna.jpg" alt="gift">
    </div>

</div>

<script>

/* ================= TYPEWRITER ================= */
const text = "Wishing you a magical 21st birthday full of love, joy, and success ✨";
let i = 0;

function typeWriter(){
    if(i < text.length){
        document.getElementById("typeText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
    }
}
window.onload = typeWriter;

/* ================= CONFETTI + REDIRECT ================= */
function goSurprise(){

    confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ffcc33', '#ffffff', '#ff7b00']
    });

    setTimeout(()=>{
        window.location.href = "surprise.html";
    }, 1000);
}

</script>

</body>
</html>
